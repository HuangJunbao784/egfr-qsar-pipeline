[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr-qsar-pipeline"
version = "0.2.0"
description = "QSAR pipeline for EGFR kinase inhibitors: RDKit 2D descriptors, Random Forest vs Gradient Boosting, cross-validation and permutation importance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HuangJunbao" }]
keywords = ["qsar", "cheminformatics", "rdkit", "egfr", "drug-discovery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.scripts]
egfr-qsar = "full_qsar_pipeline:main"

[project.urls]
Repository = "https://github.com/HuangJunbao784/egfr-qsar-pipeline"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["full_qsar_pipeline"]
